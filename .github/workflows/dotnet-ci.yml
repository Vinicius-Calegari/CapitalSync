name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore API
        run: dotnet restore CarteiraFinanceira.Api/CarteiraFinanceira.Api.csproj
      - name: Restore tests
        run: dotnet restore CarteiraFinanceira.Api.Tests/CarteiraFinanceira.Api.Tests.csproj
      - name: Build API
        run: dotnet build CarteiraFinanceira.Api/CarteiraFinanceira.Api.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test CarteiraFinanceira.Api.Tests/CarteiraFinanceira.Api.Tests.csproj --configuration Release --no-restore --verbosity normal
